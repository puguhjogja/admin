<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pemesanan Jasa Pembuatan Website</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f7f8fa;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-top: 15px;
      color: #444;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 15px;
    }
    textarea {
      resize: vertical;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      margin-top: 20px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Form Pemesanan Jasa Pembuatan Website</h2>
    <form id="orderForm">
      
      <label>Nama Lengkap *</label>
      <input type="text" id="nama" required>

      <label>Nama Usaha / Brand *</label>
      <input type="text" id="usaha" required>

      <label>Nomor WhatsApp *</label>
      <input type="tel" id="whatsapp" placeholder="Contoh: 6281234567890" required>

      <label>Email (opsional)</label>
      <input type="email" id="email">

      <label>Jenis Website yang Dipesan *</label>
      <select id="jenis" required>
        <option value="">-- Pilih Jenis Website --</option>
        <option value="Toko Online">Toko Online</option>
        <option value="Company Profile">Company Profile</option>
        <option value="Portfolio">Portfolio</option>
        <option value="Blog / Artikel">Blog / Artikel</option>
        <option value="Manajemen Hotel / Booking">Manajemen Hotel / Booking</option>
        <option value="Custom Project">Custom Project</option>
      </select>

      <label>Domain yang Diinginkan</label>
      <input type="text" id="domain" placeholder="contoh: www.namabrand.com">

      <label>Deskripsi Kebutuhan Website *</label>
      <textarea id="deskripsi" rows="4" placeholder="Ceritakan fitur yang Anda butuhkan, contoh: fitur login, galeri produk, checkout via WhatsApp, dll" required></textarea>

      <label>Warna / Tema Desain</label>
      <input type="text" id="tema" placeholder="Contoh: biru profesional, elegan hitam emas, minimalis putih biru">

      <label>Lampirkan Referensi Website (opsional)</label>
      <input type="url" id="referensi" placeholder="Contoh: https://www.websiteinspirasi.com">

      <button type="button" onclick="kirimWA()">Kirim Pesanan via WhatsApp</button>
    </form>
  </div>

  <script>
    function kirimWA() {
      const nama = document.getElementById("nama").value;
      const usaha = document.getElementById("usaha").value;
      const whatsapp = document.getElementById("whatsapp").value;
      const email = document.getElementById("email").value;
      const jenis = document.getElementById("jenis").value;
      const domain = document.getElementById("domain").value;
      const deskripsi = document.getElementById("deskripsi").value;
      const tema = document.getElementById("tema").value;
      const referensi = document.getElementById("referensi").value;

      if (!nama || !usaha || !whatsapp || !jenis || !deskripsi) {
        alert("Mohon lengkapi semua data wajib yang bertanda *");
        return;
      }

      const pesan = `📩 *Form Pemesanan Website*%0A
🧑 Nama: ${nama}%0A
🏢 Usaha/Brand: ${usaha}%0A
📱 WhatsApp: ${whatsapp}%0A
📧 Email: ${email}%0A
💻 Jenis Website: ${jenis}%0A
🌐 Domain: ${domain}%0A
🎨 Tema Desain: ${tema}%0A
🔗 Referensi: ${referensi}%0A
📝 Deskripsi Kebutuhan:%0A${deskripsi}`;

      const url = `https://wa.me/6289653135369?text=${pesan}`;
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
